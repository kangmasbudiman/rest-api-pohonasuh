; Produksi Pohon Asuh — di belakang Caddy (HTTPS) + Nginx (static) + php-fpm.
date.timezone = Asia/Jakarta
expose_php = Off
memory_limit = 256M
max_execution_time = 120

; Upload cover blog/slider & foto tagging
upload_max_filesize = 12M
post_max_size = 14M

opcache.enable = 1
opcache.memory_consumption = 192
