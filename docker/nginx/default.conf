# Nginx internal (service "web") — hanya dilihat dari dalam jaringan docker;
# HTTPS ditangani Caddy di depannya.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 14m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # File upload & aset statis lama (public/assets, adminlte)
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff2?|ttf|map)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
